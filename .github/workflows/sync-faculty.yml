name: Sync Faculty Repository

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch faculty repository
        run: |
          git remote add faculty https://github.com/ashishvirgo/FSD-CSE-15.git
          git fetch faculty main

      - name: Sync faculty files
        run: |
          git checkout faculty/main -- .
          
          # Keep this workflow file in your repository
          git checkout HEAD -- .github/workflows/sync-faculty.yml

      - name: Commit changes
        run: |
          git add .
          
          if git diff --cached --quiet; then
            echo "No new changes from faculty repository."
          else
            git commit -m "Sync latest faculty repository changes"
          fi

      - name: Push changes
        run: |
          git push origin main